[versions]
# --- 기존 정의 ---
agp = "8.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
googleGmsGoogleServices = "4.4.2"
firebaseFirestore = "25.1.4"
biometric = "1.1.0"

# 추가된 정의
room = "2.6.1"
work = "2.9.0"
ksp = "1.9.23-1.0.20"
guava = "32.1.3-android"

# ⭐ TensorFlow Lite 버전 (런타임 2.16.1, Task Text 0.4.4)
tflite = "2.16.1"
tflite_task = "0.4.4"


[libraries]
# --- 테스트 ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# --- AndroidX / UI ---
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# --- Firebase ---
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version = "22.3.0" }
firebase-database = { group = "com.google.firebase", name = "firebase-database", version = "20.3.0" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }

# --- Biometric ---
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# --- Room ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- WorkManager ---
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# --- Guava ---
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# -----------------------------------------
# ⭐ TensorFlow Lite (욕설 필터용)
# -----------------------------------------
# TensorFlow Lite 기본 런타임
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tflite" }

# TextVectorization 등용 Select TF Ops
tensorflow-lite-select-tf-ops = { module = "org.tensorflow:tensorflow-lite-select-tf-ops", version.ref = "tflite" }

# NLClassifier(Task Library)
tensorflow-lite-task-text = { module = "org.tensorflow:tensorflow-lite-task-text", version.ref = "tflite_task" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
google-dev-tools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
